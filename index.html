<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>宏瑞BOSS - 门店管理系统</title>
    <script>
      // 静态托管无 SPA fallback：不带 # 的路径（如 /store/sales）会 404。
      // 自动重定向为 HashRouter 格式（#/store/sales），保证任意路径都能打开。
      (function () {
        try {
          var path = window.location.pathname;
          var isFile = /\.[a-zA-Z0-9]{1,5}$/.test(path); // 有扩展名的是真实文件（如 .js/.png）
          if (isFile) return;
          if (window.location.hash) return; // 已是 hash 路由，正常加载
          var segs = path.split('/').filter(Boolean);
          if (segs.length === 0) return; // 根路径正常
          // 站点子路径前缀：GitHub Pages 为 /{repo}，取第一段
          var siteBase = '/' + segs[0];
          var rest = segs.slice(1).join('/');
          var target = window.location.origin + siteBase + '/#/' + rest;
          window.location.replace(target);
        } catch (e) { /* 忽略异常，不影响正常加载 */ }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-C3Rgf5P4.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BDkQ09tG.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
