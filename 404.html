<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>正在跳转...</title>
  <script>
    // 静态托管无 SPA fallback：任何不带 # 的路径（如 /store/sales）会命中 404 页。
    // 自动转为 HashRouter 格式（#/store/sales）并重定向到应用根路径。
    (function () {
      try {
        var path = window.location.pathname;
        var isFile = /\.[a-zA-Z0-9]{1,5}$/.test(path); // 有扩展名的真实文件不处理
        if (!isFile && path && path !== '/' && path !== '/index.html' && path !== '/404.html') {
          var target = window.location.origin + '/#/' + path.replace(/^\//, '');
          window.location.replace(target);
        } else {
          window.location.replace(window.location.origin + '/');
        }
      } catch (e) {
        window.location.replace(window.location.origin + '/');
      }
    })();
  </script>
</head>
<body>
  <div style="font-family: sans-serif; text-align: center; padding: 60px 20px; color: #64748b;">
    <h2>正在加载系统...</h2>
    <p>如果长时间未跳转，请点击 <a href="/">这里</a></p>
  </div>
</body>
</html>
